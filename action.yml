name: 'Feishu Notify'
description: 'Post a rich-text message to a Feishu custom bot webhook'
inputs:
  webhook:
    description: 'Feishu custom bot webhook URL'
    required: true
  secret:
    description: 'Bot sign secret, when signature verification is enabled'
    required: false
  title:
    description: 'Rich-text title (non-review_requested events)'
    required: false
  message:
    description: 'Rich-text body, one line per paragraph (non-review_requested events)'
    required: false
  link:
    description: 'URL appended as a "查看详情" hyperlink (non-review_requested events)'
    required: false
  reviewer-map:
    description: 'YAML map of GitHub login to Feishu open_id (ou_...), used to @ the reviewer on pull_request review_requested events'
    required: false
  enable-mention:
    description: "'true' to @ the requested reviewer via reviewer-map; missing mapping then fails the step. 'false' (default) sends the card without any mention"
    required: false
    default: 'false'
  title-template:
    description: 'Title template for review_requested events, variables: {{pr.number}} {{pr.title}} {{pr.url}} {{author}} {{reviewer}} {{team}}'
    required: false
  message-template:
    description: 'Body template for review_requested events, one line per paragraph; extra element tokens: {{pr.anchor}} (PR link) and {{mention}} (@ reviewer)'
    required: false
  app-id:
    description: 'Feishu app ID for image upload (enables inline image preview). Omit to fall back to image links.'
    required: false
  app-secret:
    description: 'Feishu app secret for image upload. Required when app-id is set.'
    required: false
  github-token:
    description: 'GitHub token used to resolve private user-attachments images via the API body_html (signed URLs). Pass secrets.GITHUB_TOKEN; needs issues:read / pull-requests:read. Omit to download image URLs directly (public repos only).'
    required: false
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'send'
  color: 'blue'
