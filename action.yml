name: 'Feishu Webhook Notify'
description: 'Send a message to a Feishu custom bot webhook'
inputs:
  webhook:
    description: 'Feishu custom bot webhook URL'
    required: true
  secret:
    description: 'Bot sign secret, when signature verification is enabled'
    required: false
  payload:
    description: 'JSON message body, e.g. {"msg_type":"text","content":{"text":"hi"}}'
    required: true
runs:
  using: 'node20'
  main: 'index.js'
branding:
  icon: 'send'
  color: 'blue'