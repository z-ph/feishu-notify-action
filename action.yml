name: 'Feishu Notify'
description: 'Post a rich-text message to a Feishu custom bot webhook'
inputs:
  webhook:
    description: 'Feishu custom bot webhook URL'
    required: true
  secret:
    description: 'Bot sign secret, when signature verification is enabled'
    required: false
  title:
    description: 'Optional rich-text title'
    required: false
  message:
    description: 'Optional rich-text body, one line per paragraph'
    required: false
  link:
    description: 'Optional URL appended as a "查看详情" hyperlink'
    required: false
runs:
  using: 'node20'
  main: 'index.js'
branding:
  icon: 'send'
  color: 'blue'